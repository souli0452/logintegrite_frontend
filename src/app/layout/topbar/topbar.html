<mat-toolbar class="topbar">
  <form class="topbar__search" role="search" (submit)="rechercher($event, champ.value)">
    <lucide-icon [name]="icons['Search']" [size]="18" class="topbar__search-icon"></lucide-icon>
    <input #champ
           type="search"
           name="q"
           autocomplete="off"
           aria-label="Rechercher une personne par nom ou dénomination"
           placeholder="Rechercher une personne par nom ou dénomination"
           class="topbar__search-input">
  </form>
  <span class="topbar__spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="topbar__user" aria-label="Menu du compte">
    <div class="topbar__user-avatar" aria-hidden="true">
      <lucide-icon [name]="icons['User']" [size]="16"></lucide-icon>
    </div>
    <div class="topbar__user-info">
      <div class="topbar__user-name">{{ auth.username() ?? '...' }}</div>
      <span class="role-badge" [ngClass]="roleAffiche().classe">{{ roleAffiche().libelle }}</span>
    </div>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="auth.logout()">
      <lucide-icon [name]="icons['LogOut']" [size]="16"></lucide-icon>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</mat-toolbar>
