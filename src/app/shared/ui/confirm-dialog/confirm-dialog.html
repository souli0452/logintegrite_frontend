<h2 mat-dialog-title>{{ data.titre }}</h2>

<mat-dialog-content>
  <p class="message">{{ data.message }}</p>
  @if (data.detail) {
    <p class="detail">{{ data.detail }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="annuler()">{{ data.libelleAnnuler ?? 'Annuler' }}</button>
  <button
    mat-flat-button
    [color]="data.danger ? 'warn' : 'primary'"
    (click)="confirmer()">
    {{ data.libelleConfirmer ?? 'Confirmer' }}
  </button>
</mat-dialog-actions>
