<app-page-header
  titre="Dossiers"
  [sousTitre]="totalElements() + ' dossier(s) enregistre(s).'">
  
</app-page-header>

@if (chargement()) {
  <div class="liste-loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
} @else if (dossiers().length === 0) {
  <app-empty-state
    titre="Aucun dossier"
    message="Ouvrez le premier dossier pour commencer."
    [icone]="icons['FolderOpen']">
    
  </app-empty-state>
} @else {
  <div class="liste-table">
    <table mat-table [dataSource]="dossiers()">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>N° Dossier</th>
        <td mat-cell *matCellDef="let d" class="cellule-strong">{{ d.numeroDossier ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="intitule">
        <th mat-header-cell *matHeaderCellDef>Intitulé</th>
        <td mat-cell *matCellDef="let d">{{ d.intitule ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="source">
        <th mat-header-cell *matHeaderCellDef>Source</th>
        <td mat-cell *matCellDef="let d" class="cellule-muted">{{ d.sourceSignalementLibelle }}</td>
      </ng-container>

      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let d">
          <app-status-badge [libelle]="d.statutDossier" [type]="typeStatut(d.statutDossier)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="dateOuverture">
        <th mat-header-cell *matHeaderCellDef>Ouverture</th>
        <td mat-cell *matCellDef="let d">{{ d.dateOuverture }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="cellule-right">Actions</th>
        <td mat-cell *matCellDef="let d" class="cellule-right">
          <button mat-icon-button matTooltip="Voir le détail" (click)="voir(d)">
            <lucide-icon [name]="icons['Eye']" [size]="16"></lucide-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colonnesAffichees"></tr>
      <tr mat-row *matRowDef="let row; columns: colonnesAffichees;"></tr>
    </table>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="taillePage()"
      [pageIndex]="pageCourante()"
      [pageSizeOptions]="[10, 20, 50, 100]"
      (page)="changerPage($event)">
    </mat-paginator>
  </div>
}
