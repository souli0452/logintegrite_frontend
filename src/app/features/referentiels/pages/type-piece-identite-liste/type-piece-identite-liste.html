<div class="referentiel-page">

  <button type="button" class="btn-retour-hub" (click)="retour()">
    <lucide-icon [name]="icons['ArrowLeft']" [size]="14"></lucide-icon>
    <span>Retour au hub des référentiels</span>
  </button>

  <header class="referentiel-page__header">
    <div class="referentiel-page__titre">
      <lucide-icon [name]="icons['IdCard']" [size]="24" class="referentiel-page__icone"></lucide-icon>
      <div>
        <h1>Types de pièce d'identité</h1>
        <p>Documents d'identité acceptés (CNIB, passeport, permis...)</p>
      </div>
    </div>
    <button type="button" class="btn-principal" (click)="ouvrir(null)">
      <lucide-icon [name]="icons['Plus']" [size]="16"></lucide-icon>
      <span>Nouveau type</span>
    </button>
  </header>

  <main class="referentiel-page__corps">
    @if (chargement()) {
      <div class="etat-chargement">
        <app-chargement-liste />
        <p>Chargement…</p>
      </div>
    } @else if (types().length === 0) {
      <div class="etat-vide">
        <lucide-icon [name]="icons['IdCard']" [size]="40"></lucide-icon>
        <p>Aucun type enregistré</p>
      </div>
    } @else {
      <table mat-table [dataSource]="types()" class="tableau-referentiel">

        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let t" class="cellule-mono">{{ t.code }}</td>
        </ng-container>

        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef>Libellé</th>
          <td mat-cell *matCellDef="let t" class="cellule-strong">{{ t.libelle }}</td>
        </ng-container>

        <ng-container matColumnDef="actif">
          <th mat-header-cell *matHeaderCellDef>Actif</th>
          <td mat-cell *matCellDef="let t">
            <mat-slide-toggle
              [checked]="t.actif"
              (change)="basculerActif(t)"
              matTooltip="Activer / désactiver">
            </mat-slide-toggle>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="cellule-right">Actions</th>
          <td mat-cell *matCellDef="let t" class="cellule-right">
            <button mat-icon-button (click)="ouvrir(t)" matTooltip="Modifier">
              <lucide-icon [name]="icons['Pencil']" [size]="16"></lucide-icon>
            </button>
            <button mat-icon-button (click)="supprimer(t)" matTooltip="Supprimer">
              <lucide-icon [name]="icons['Trash2']" [size]="16" class="ico-danger"></lucide-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
        <tr mat-row *matRowDef="let row; columns: colonnes"></tr>
      </table>

      <p class="tableau-footer">{{ types().length }} type(s) au total</p>
    }
  </main>
</div>
