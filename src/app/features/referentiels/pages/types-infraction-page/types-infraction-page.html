<app-page-header
  titre="Types d'infraction"
  [sousTitre]="'Detail des infractions par categorie. ' + items().length + ' types.'">
  <button mat-flat-button color="primary" (click)="ouvrir(null)">
    <lucide-icon [name]="icons['Plus']" [size]="16"></lucide-icon>
    <span>Nouveau type</span>
  </button>
</app-page-header>

@if (chargement()) {
  <div class="liste-loading">
    <app-chargement-liste />
  </div>
} @else if (items().length === 0) {
  <app-empty-state
    titre="Aucun type d'infraction"
    message="Creez le premier via le bouton ci-dessus." />
} @else {
  <div class="liste-table">
    <table mat-table [dataSource]="items()">
      <ng-container matColumnDef="libelle">
        <th mat-header-cell *matHeaderCellDef>Libellé</th>
        <td mat-cell *matCellDef="let item" class="cellule-strong">{{ item.libelle }}</td>
      </ng-container>

      <ng-container matColumnDef="categorie">
        <th mat-header-cell *matHeaderCellDef>Catégorie parente</th>
        <td mat-cell *matCellDef="let item" class="cellule-muted">
          {{ item.categorieInfractionLibelle }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actif">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let item">
          <app-status-badge
            [libelle]="item.actif ? 'Actif' : 'Inactif'"
            [type]="item.actif ? 'success' : 'neutral'" />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="cellule-right">Actions</th>
        <td mat-cell *matCellDef="let item" class="cellule-right">
          <button mat-icon-button matTooltip="Modifier" (click)="ouvrir(item)">
            <lucide-icon [name]="icons['Pencil']" [size]="16"></lucide-icon>
          </button>
          <button mat-icon-button matTooltip="Supprimer" (click)="supprimer(item)">
            <lucide-icon [name]="icons['Trash2']" [size]="16" class="icone-danger"></lucide-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colonnesAffichees"></tr>
      <tr mat-row *matRowDef="let row; columns: colonnesAffichees;"></tr>
    </table>
  </div>
}
